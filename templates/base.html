<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Employee History{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}">Employee History</a><span>Local Hiring Portal</span></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Local-only application • Applicant data stays on this computer</footer>
</body>
</html>
